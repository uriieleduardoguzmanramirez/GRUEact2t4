
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de productos</title>
    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body>
    <main>
        <h1 th:text="${nombreProyecto}">Catálogo</h1>
        <p>Productos registrados en el sistema</p>

        <a th:href="@{/productos/nuevo}">Agregar producto</a>

        <h3>Filtrar por categoría</h3>

        <form th:action="@{/productos}" method="get">
            <select name="categoria">
                <option value="">Todas</option>
                <option value="Papeleria">Papelería</option>
                <option value="Tecnologia">Tecnología</option>
            </select>
            <button type="submit">Buscar</button>
        </form>

        <table border="1">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="producto : ${productos}">
                    <td th:text="${producto.id}"></td>
                    <td th:text="${producto.nombre}"></td>
                    <td th:text="${producto.categoria}"></td>
                    <td th:text="${producto.precio}"></td>
                    <td>
                        <a th:href="@{/productos/{id}(id=${producto.id})}">
                            Ver detalle
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
