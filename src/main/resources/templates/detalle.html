
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle del producto</title>
    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body>
    <main>
        <h1>Detalle del producto</h1>

        <p>ID: <span th:text="${producto.id}"></span></p>
        <p>Nombre: <span th:text="${producto.nombre}"></span></p>
        <p>Categoría: <span th:text="${producto.categoria}"></span></p>
        <p>Precio: $<span th:text="${producto.precio}"></span></p>

        <a th:href="@{/productos}">Regresar</a>
    </main>
</body>
</html>
